name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Nuxt that meta.compatibility allows, and the newest 4.x.
        nuxt: ['4.0', '4']
    name: Nuxt ${{ matrix.nuxt }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use Nuxt ${{ matrix.nuxt }}
        run: npm install --no-save nuxt@${{ matrix.nuxt }} && npx nuxt --version
      - run: npx playwright-core install --with-deps chromium
      - run: npm run dev:prepare
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run prepack
